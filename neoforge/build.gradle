plugins {
    id("net.neoforged.moddev")
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
            systemProperty "neoforge.enabledGameTestNamespaces", mod_id
        }

        server {
            server()
            programArgument "--nogui"
            systemProperty "neoforge.enabledGameTestNamespaces", mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty "neoforge.enabledGameTestNamespaces", mod_id
        }

        configureEach {
            systemProperty "forge.logging.markers", "REGISTRIES"
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()

        testedMod = mods."${mod_id}"
    }
}

sourceSets.main.resources { srcDir "src/generated/resources" }

repositories {
    maven {
        // location of the maven that hosts JEI files
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    flatDir {
        dirs 'libs'
    }
    maven {
        name = "Ponder"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {
        name = "Create"
        url = "https://maven.createmod.net"
    }
}

dependencies {
    if (project.hasProperty("valhelsia_core_version") && findProperty("valhelsia_core_version")?.trim()) {
        implementation "net.valhelsia:valhelsia_core-neoforge:${valhelsia_core_version}"
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation "net.neoforged:testframework:${neo_version}"

    if (project.hasProperty("jei_version") && findProperty("jei_version")?.trim()) {
        // compile against the JEI API but do not include it at runtime
        compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
        // at runtime, use the full JEI jar
        runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    }

//    implementation("net.createmod.ponder:Ponder-NeoForge-1.21.1:${ponder_version}")
}

test {
    useJUnitPlatform()
}

tasks.named("processResources", ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(["META-INF/neoforge.mods.toml"]) {
        expand replaceProperties
    }
}
